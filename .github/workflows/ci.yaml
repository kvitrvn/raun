name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The action would cache ~/.cache/go-build, which the Makefile does not use.
      - name: Set up Go
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            .tmp/go-build
            .tmp/staticcheck
          key: go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-

      # The same target as locally: CI adds no check of its own.
      - name: Verify
        run: make verify

      # Reads the online vulnerability database, so it warns instead of failing:
      # a new advisory must not block unrelated work.
      - name: Scan Go vulnerabilities
        id: vuln
        run: make vuln
        continue-on-error: true

      - name: Report vulnerabilities
        if: steps.vuln.outcome == 'failure'
        run: |
          echo "::warning file=go.mod::Go vulnerabilities detected. See the 'Scan Go vulnerabilities' step and run 'make vuln' locally."

  commits:
    name: Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: make commits BASE="$BASE_SHA"
